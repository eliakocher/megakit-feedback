name: Bug Report
description: Something in MegaKit doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. The more exact the steps, the faster it gets fixed.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - MegaClick (Finder menu, cut and paste)
        - MegaIntelligence (AI panel)
        - MegaCorners (screen corners)
        - MegaKit (setup, Settings, menu bar)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Pressing ⌘Z after moving a file put it back in the wrong place.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select a file on the Desktop
        2. Press ⌘X, then ⌘V in a folder
        3. Press ⌘Z
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MegaKit version
      placeholder: Menu bar → About MegaKit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images or screen recordings in here.
