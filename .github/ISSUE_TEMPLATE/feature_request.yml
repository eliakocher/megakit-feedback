name: Feature Request
description: An idea that would make MegaKit better.
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - MegaClick (Finder menu, cut and paste)
        - MegaIntelligence (AI panel)
        - MegaCorners (screen corners)
        - MegaKit (setup, Settings, menu bar)
        - Something new
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
      placeholder: I often convert screenshots to JPEG before sending them, and it takes three steps.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      placeholder: A "Convert to JPEG" item right in MegaClick's menu.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, screenshots, or apps that do it well.
